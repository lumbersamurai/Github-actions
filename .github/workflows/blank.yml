# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    #variables de entorno del job
    env:
      #va a ser para aws
      platform: aws
      #la region y la cuenta que es de dev
      region: us-east-1
      account_id: development
      #password aqui para que el if de abajo lo pueda leer
      USER_PASS: ${{ secrets.PROJECT_PASSWORD }}

    steps:
      # Cambiado a v5
      - uses: actions/checkout@v5                       

      - name: Run a one-line script
        run: echo Hello, world!

      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

      #Run un mensaje inicial
      - name: Mostrar mensaje inicial
        run: echo "Hola mundo y hola tonotos"

      #Run de laas var de entorno
      - name: Auditoria de variables de entorno
        run: |
          echo "Plataforma de despliegue: ${{ env.platform }}"
          echo "Región de despliegue: ${{ env.region }}"
          echo "Cuenta de despliegue: ${{ env.account_id }}"

      #solo corre si es aws
      - name: Paso solo para AWS
        if: env.platform == 'aws'
        run: echo "Este paso solo se ejecuta si la plataforma es AWS"

      #este nunca deberia correr xq platform siempre es aws
      - name: Paso solo para Azure
        if: env.platform == 'azure'
        run: echo "Este paso solo se ejecuta si la plataforma es Azure"

      #quien ejecuto y en que repo
      - name: Show Metadatos Basicos
        run: |
          echo "Usuuario ejecutor: ${{ github.actor }}"
          echo "Repo activo: ${{ github.repository }}"

      # (Omitiendo los pasos anteriores por brevedad)
      #esto tira todo el json del evento para debuguear
      - name: Debug del payload completo
        run: echo "${{ toJSON(github.event) }}"

      #checa que la contraseña si exista
      - name: Validar credenciales
        if: env.USER_PASS != ''
        run: |
          echo "Estado: Credenciales de usuario y contraseña configuradas correctamente"

      #sale enmascarado xq es un secret, asi debe de ser
      - name: Referencias a var global
        run: |
          echo "Version del proyecto: ${{ secrets.PROJECT_VERSION }}"